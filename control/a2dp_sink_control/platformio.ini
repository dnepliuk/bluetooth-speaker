[platformio]
default_envs = control-baseline

[env]
platform = espressif32@7.1.3
platform_packages = platformio/framework-espidf@4.60100.0
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200

; Both selectors are checked against each other at compile time.
[env:control-baseline]
build_flags = -DCONTROL_VARIANT=1
board_build.cmake_extra_args = -DCONTROL_VARIANT=1

[env:control-main-config]
build_flags = -DCONTROL_VARIANT=2
board_build.cmake_extra_args = -DCONTROL_VARIANT=2

[env:control-streambuffer]
build_flags = -DCONTROL_VARIANT=3
board_build.cmake_extra_args = -DCONTROL_VARIANT=3

[env:control-i2s-silence]
build_flags = -DCONTROL_VARIANT=4
board_build.cmake_extra_args = -DCONTROL_VARIANT=4

[env:control-pipeline]
build_flags = -DCONTROL_VARIANT=5
board_build.cmake_extra_args = -DCONTROL_VARIANT=5

[env:control-clocked-pipeline]
build_flags = -DCONTROL_VARIANT=6
board_build.cmake_extra_args = -DCONTROL_VARIANT=6

[env:control-spsc-pipeline]
build_flags = -DCONTROL_VARIANT=7
board_build.cmake_extra_args = -DCONTROL_VARIANT=7

[env:control-spsc-dma-aligned]
build_flags = -DCONTROL_VARIANT=8
board_build.cmake_extra_args = -DCONTROL_VARIANT=8

[env:control-official-i2s-reference]
build_flags = -DCONTROL_VARIANT=9
board_build.cmake_extra_args = -DCONTROL_VARIANT=9 -DCONTROL_OFFICIAL_ENV=control-official-i2s-reference
board_build.esp-idf.sdkconfig_path = sdkconfig.control-official-i2s-reference
extra_scripts =
    pre:tools/matrix_config_guard.py
    post:tools/matrix_config_guard.py

[env:control-official-160-nosleep]
extends = env:control-official-i2s-reference
board_build.cmake_extra_args = -DCONTROL_VARIANT=9 -DCONTROL_OFFICIAL_ENV=control-official-160-nosleep
board_build.esp-idf.sdkconfig_path = sdkconfig.control-official-160-nosleep

[env:control-official-240-sleep]
extends = env:control-official-i2s-reference
board_build.cmake_extra_args = -DCONTROL_VARIANT=9 -DCONTROL_OFFICIAL_ENV=control-official-240-sleep
board_build.esp-idf.sdkconfig_path = sdkconfig.control-official-240-sleep

[env:control-official-240-nosleep]
extends = env:control-official-i2s-reference
board_build.cmake_extra_args = -DCONTROL_VARIANT=9 -DCONTROL_OFFICIAL_ENV=control-official-240-nosleep
board_build.esp-idf.sdkconfig_path = sdkconfig.control-official-240-nosleep
