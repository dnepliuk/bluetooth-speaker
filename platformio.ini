[platformio]
default_envs = esp32doit-devkit-v1

[env]
platform = platformio/espressif32@7.1.3
board = esp32doit-devkit-v1
framework = espidf

monitor_speed = 115200

board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

; Existing environment / sdkconfig path remains the ESP-IDF 6.1.0 baseline.
[env:esp32doit-devkit-v1]
platform_packages = platformio/framework-espidf@4.60100.0

; PlatformIO gives this environment its own sdkconfig and .pio/build directory.
[env:esp32doit-devkit-v1-idf60]
platform = platformio/espressif32@7.0.1
platform_packages = platformio/framework-espidf@4.60001.0

